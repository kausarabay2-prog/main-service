spring.application.name=main-service
server.port=8080

# PostgreSQL (docker-compose ішінде ортаның айнымалылары осыны ауыстырады)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/lms}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:lms}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:lms}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA: кестелерді тек Liquibase жасайды
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Liquibase
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
   # Swagger
springdoc.swagger-ui.path=/swagger-ui.html

# Logging
logging.level.root=INFO
logging.level.com.bitlab=DEBUG