                    <h2>Practice: if-else conditions</h2>
                    <ol>
                    <li>Write a program that checks whether an int variable is positive, negative or zero and prints the result.</li>
                    <li>Check whether a number is even or odd with the remainder operator <code>%</code>.</li>
                    <li>Convert a score from 0 to 100 to a letter grade: 90 and above is A, 80 and above is B, 70 and above is C, 60 and above is D, and anything lower is F.</li>
                    <li>Given the age of a visitor and a boolean variable <code>hasTicket</code>, decide whether the visitor may enter. Entry is allowed when the visitor has a ticket and is at least 12 years old.</li>
                    <li>Find the largest of three int numbers using only if-else statements.</li>
                    <li>Check whether a year is a leap year. A year is a leap year when it is divisible by 4, except for years divisible by 100 that are not divisible by 400.</li>
                    </ol>
                    <p>Test every program with at least three different input values, including the boundary values such as 0, 60 and 90.</p>
