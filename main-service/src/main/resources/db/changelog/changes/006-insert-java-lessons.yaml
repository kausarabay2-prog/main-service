        - insert:
            tableName: lesson
            columns:
              - column:
                  name: name
                  value: "Lecture for Loops"
              - column:
                  name: description
                  value: "The for, while and do-while loops in Java, plus break and continue."
              - column:
                  name: content
                  value: |-
                    <h2>Loops in Java</h2>
                    <p>A loop repeats a block of code while some condition stays true. Without loops you would have to copy the same lines again and again. Java provides three main loops: <code>for</code>, <code>while</code> and <code>do-while</code>.</p>
                    <h3>The for loop</h3>
                    <p>Use <code>for</code> when you know how many times the code must run. It has three parts: initialization, condition and update.</p>
                    <pre><code>for (int i = 1; i &lt;= 5; i++) {
                        System.out.println("Step " + i);
                    }</code></pre>
                    <h3>The while loop</h3>
                    <p>The <code>while</code> loop checks the condition before every iteration. It is the right choice when the number of repetitions is not known in advance.</p>
                    <pre><code>int number = 1;
                    while (number &lt; 100) {
                        number = number * 2;
                    }
                    System.out.println(number);</code></pre>
                    <h3>The do-while loop</h3>
                    <p>The <code>do-while</code> loop checks the condition after the body, so the body always runs at least once. It is useful, for example, when you ask a user for input and repeat the question until the answer is valid.</p>
                    <h3>break and continue</h3>
                    <p>The keyword <code>break</code> stops the loop immediately, and <code>continue</code> skips the rest of the current iteration and moves on to the next one.</p>
                    <h3>Infinite loops</h3>
                    <p>If the condition never becomes false, the loop never ends. Always make sure that the variable used in the condition changes inside the loop.</p>
