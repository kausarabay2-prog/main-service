              - column:
                  name: name
                  value: "Lecture for Variables and Data Types"
              - column:
                  name: description
                  value: "What a variable is, the main primitive types, naming rules and type conversion in Java."
              - column:
                  name: content
                  value: |-
                    <h2>Variables and Data Types in Java</h2>
                    <p>A variable is a named place in memory where a program stores a value. Java is a statically typed language, which means that you must declare the type of every variable before you use it, and the compiler checks that you use the variable in a way that matches its type.</p>
                    <h3>Primitive types</h3>
                    <p>Java has eight primitive types. The most common are <code>int</code> for whole numbers, <code>long</code> for very large whole numbers, <code>double</code> for numbers with a fractional part, <code>boolean</code> for true or false values, and <code>char</code> for a single character. The remaining ones are <code>byte</code>, <code>short</code> and <code>float</code>.</p>
                    <pre><code>int age = 21;
                    double price = 19.99;
                    boolean isStudent = true;
                    char grade = 'A';
                    String name = "Alice";</code></pre>
                    <p><code>String</code> is not a primitive type. It is a class that represents text, and it is used so often that Java lets you create strings with simple double quotes.</p>
                    <h3>Naming rules</h3>
                    <p>A variable name may contain letters, digits and underscores, but it cannot start with a digit and cannot be a reserved word such as <code>class</code> or <code>int</code>. By convention, Java developers write variable names in camelCase, for example <code>studentAge</code>, and they choose names that explain the meaning of the value.</p>
                    <h3>Type conversion</h3>
                    <p>Java converts a smaller type to a larger one automatically, for example an <code>int</code> can be stored in a <code>double</code>. Going the other way requires an explicit cast, for example <code>int rounded = (int) 3.99;</code>. The cast cuts off the fractional part, so the result is 3 and not 4.</p>
                    <h3>Constants</h3>
                    <p>If a value must never change, declare the variable with the keyword <code>final</code>. By convention the names of constants are written in upper case, for example <code>final int MAX_ATTEMPTS = 3;</code>.</p>
