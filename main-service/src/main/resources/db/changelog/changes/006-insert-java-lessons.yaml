                  name: order_number
                  valueNumeric: 1
              - column:
                  name: chapter_id
                  valueComputed: "(SELECT ch.id FROM chapter ch JOIN course c ON c.id = ch.course_id WHERE c.name = 'Java Developer' AND ch.name = 'Variables and Data Types')"
        - insert:
            tableName: lesson
            columns:
              - column:
                  name: name
                  value: "Practice for Variables and Data Types"
              - column:
                  name: description
                  value: "Five tasks to practise variables, arithmetic and type conversion in Java."
              - column:
                  name: content
                  value: |-
                    <h2>Practice: Variables and Data Types</h2>
                    <p>Complete the following tasks in a new Java class with a <code>main</code> method. Print the result of every task with <code>System.out.println</code>.</p>
                    <ol>
                    <li>Declare variables for a student: name (String), age (int), average grade (double) and a flag that shows whether the student has a scholarship (boolean). Print all of them on one line.</li>
                    <li>Create two int variables, a and b, with the values 17 and 5. Print their sum, difference, product, the result of integer division and the remainder of the division.</li>
                    <li>Divide 17 by 5 using double variables and compare the output with the integer division from the previous task. Explain the difference in a comment.</li>
                    <li>Convert the double value 7.95 to int with a cast and print it. What happened to the fractional part?</li>
                    <li>Store the text "Java" and the number 21 in two variables and print the sentence "I am learning Java 21" by joining them with the + operator.</li>
                    </ol>
                    <p>Hint: remember that dividing an int by an int gives an int in Java, so <code>17 / 5</code> is 3, not 3.4.</p>
