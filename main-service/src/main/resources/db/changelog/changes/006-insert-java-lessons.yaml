        - insert:
            tableName: lesson
            columns:
              - column:
                  name: name
                  value: "Lecture for if-else conditions"
              - column:
                  name: description
                  value: "How to make decisions in Java with if, else if and else, comparison and logical operators."
              - column:
                  name: content
                  value: |-
                    <h2>if-else conditions in Java</h2>
                    <p>Programs rarely run in a straight line. Very often the code must make a decision: show a message only to adults, apply a discount only when the order is large enough, or reject a password that is too short. Java uses conditional statements for this purpose.</p>
                    <h3>The if statement</h3>
                    <p>The <code>if</code> statement runs a block of code only when its condition is true. The condition must be a boolean expression.</p>
                    <pre><code>int age = 18;
                    if (age &gt;= 18) {
                        System.out.println("You are an adult.");
                    }</code></pre>
                    <h3>if-else and else if</h3>
                    <p>Add <code>else</code> to run code when the condition is false. Use <code>else if</code> to check several conditions one after another. Java stops at the first condition that is true and skips the rest.</p>
                    <pre><code>int score = 76;
                    if (score &gt;= 90) {
                        System.out.println("Excellent");
                    } else if (score &gt;= 70) {
                        System.out.println("Good");
                    } else {
                        System.out.println("Try again");
                    }</code></pre>
                    <h3>Comparison and logical operators</h3>
                    <p>Conditions are built with the comparison operators <code>==</code>, <code>!=</code>, <code>&lt;</code>, <code>&gt;</code>, <code>&lt;=</code> and <code>&gt;=</code>, and combined with the logical operators <code>&amp;&amp;</code> (and), <code>||</code> (or) and <code>!</code> (not). For example, <code>age &gt;= 12 &amp;&amp; hasTicket</code> is true only when both parts are true.</p>
                    <h3>Common mistakes</h3>
                    <p>Do not use <code>=</code> (assignment) instead of <code>==</code> (comparison). Do not compare strings with <code>==</code>; use the <code>equals()</code> method, for example <code>name.equals("Alice")</code>. Always use curly braces, even for a single line, because it prevents hard-to-find bugs when the code is changed later.</p>
