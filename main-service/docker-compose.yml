services:
  postgres:
    image: postgres:16
    container_name: lms-postgres
    environment:
      POSTGRES_DB: lms
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: lms
    ports:
      - "5433:5432"
    volumes:
      - lms-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms -d lms"]
      interval: 5s
      timeout: 5s
      retries: 10

  main-service:
    image: kakon775/lms-main-service:1.2
    container_name: lms-main-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/lms
      SPRING_DATASOURCE_USERNAME: lms
      SPRING_DATASOURCE_PASSWORD: lms
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/lms/protocol/openid-connect/certs
      SERVER_PORT: "8080"
    ports:
      - "8080:8080"

  keycloak-db:
    image: postgres:16
    container_name: keycloak-postgres
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - keycloak-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    container_name: lms-keycloak
    command: start-dev --import-realm
    depends_on:
      keycloak-db:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak/lms-realm.json:/opt/keycloak/data/import/lms-realm.json:ro

  keycloak-init:
    image: postgres:16
    container_name: lms-keycloak-init
    depends_on:
      keycloak-db:
        condition: service_healthy
      keycloak:
        condition: service_started
    environment:
      PGHOST: keycloak-db
      PGUSER: keycloak
      PGPASSWORD: keycloak
      PGDATABASE: keycloak
    volumes:
      - ./keycloak/insert.sql:/insert.sql:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        until psql -tAc "SELECT 1 FROM realm WHERE name = 'lms'" 2>/dev/null | grep -q 1; do echo "waiting for realm lms..."; sleep 3; done
        psql -v ON_ERROR_STOP=1 -f /insert.sql
    restart: "no"
volumes:
  lms-pgdata:
  keycloak-pgdata: